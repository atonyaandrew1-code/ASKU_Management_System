<!DOCTYPE html>
<html>
<head>
    <title>User Management - ASKU Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #1f4e78;
        }

        .top-buttons {
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            margin-right: 8px;
            text-decoration: none;
            border-radius: 5px;
            color: white;
            background-color: #1f4e78;
        }

        .button:hover {
            opacity: 0.85;
        }

        .edit-button {
            background-color: #28a745;
        }

        .delete-button {
            background-color: #dc3545;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
            color: white;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #1f4e78;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .delete-form {
            display: inline;
        }
    </style>
</head>

<body>

    <h1>User Management</h1>

    <div class="top-buttons">
        <a href="/add_user" class="button">
            + Add User
        </a>

        <a href="/" class="button">
            Dashboard
        </a>
    </div>

    <table>

        <tr>
            <th>User ID</th>
            <th>Username</th>
            <th>Member ID</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        {% for user in users %}

        <tr>

            <td>{{ user[0] }}</td>

            <td>{{ user[1] }}</td>

            <td>{{ user[2] }}</td>

            <td>{{ user[3] }}</td>

            <td>
                {% if user[4] %}
                    Active
                {% else %}
                    Inactive
                {% endif %}
            </td>

            <td>

                <div class="actions">

                    <a
                        href="/edit_user/{{ user[0] }}"
                        class="button edit-button"
                    >
                        Edit
                    </a>

                    {% if user[0] != session["user_id"] %}

                    <form
                        action="/delete_user/{{ user[0] }}"
                        method="POST"
                        class="delete-form"
                        onsubmit="return confirm('Are you sure you want to delete this user?');"
                    >

                        <button
                            type="submit"
                            class="delete-button"
                        >
                            Delete
                        </button>

                    </form>

                    {% endif %}

                </div>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
