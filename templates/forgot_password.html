
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ASKU Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #1f4e78;
        }

        p {
            color: #555;
            line-height: 1.7;
        }

        .notice {
            margin: 22px 0;
            padding: 15px;
            background: #eef4f8;
            border-left: 4px solid #1f4e78;
            border-radius: 6px;
            color: #333;
            line-height: 1.6;
            text-align: left;
        }

        .back-link {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #1f4e78;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            background: #163a5a;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Forgot Password?</h2>

        <p>
            Having trouble accessing your ASKU Management System account?
        </p>

        <div class="notice">
            <strong>Password assistance</strong>
            <p>
                Please contact the ASKU System Administrator
                to reset your password. The administrator will
                provide a temporary password, which you must
                change when you log in.
            </p>
        </div>

        <a href="{{ url_for('login') }}" class="back-link">
            Back to Login
        </a>
    </div>
</body>
</html>
