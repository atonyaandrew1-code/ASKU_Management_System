<!DOCTYPE html>
<html>
<head>
    <title>Activities - ASKU Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #1f4e78;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .actions {
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #1f4e78;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1f4e78;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<header>
    <h1>ASKU Management System</h1>
    <h2>Activities</h2>
</header>

<div class="container">

<div class="actions">
    <a href="/add_activity" class="button">Add Activity</a>
    <a href="/" class="button">Back to Dashboard</a>
</div>

    <table>
        <thead>
            <tr>
                <th>Activity ID</th>
                <th>Activity Name</th>
                <th>Activity Date</th>
                <th>Location</th>
                <th>Created By</th>
            </tr>
        </thead>

        <tbody>
            {% for activity in activities %}
            <tr>
                <td>{{ activity[0] }}</td>
                <td>{{ activity[1] }}</td>
                <td>{{ activity[2] }}</td>
                <td>{{ activity[3] }}</td>
                <td>{{ activity[4] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No activities found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
