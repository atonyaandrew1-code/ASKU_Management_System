<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Contribution - ASKU Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f4e78;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #1f4e78;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5a;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #1f4e78;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>ASKU Management System</h1>
    <p>Edit Contribution</p>
</div>

<div class="container">

    <div class="form-box">

        <h2>Edit Contribution</h2>

        <form method="POST">

            <label>Contribution ID</label>
            <input
                type="text"
                value="{{ contribution[0] }}"
                disabled
            >

            <label>Member</label>
            <select name="member_id" required>

                {% for member in members %}
                    <option
                        value="{{ member[0] }}"
                        {% if member[0] == contribution[1] %}selected{% endif %}
                    >
                        {{ member[0] }} - {{ member[1] }} {{ member[2] }}
                    </option>
                {% endfor %}

            </select>

            <label>Amount</label>
            <input
                type="number"
                name="amount"
                step="0.01"
                value="{{ contribution[2] }}"
                required
            >

            <label>Contribution Date</label>
            <input
                type="date"
                name="contribution_date"
                value="{{ contribution[3] }}"
                required
            >

            <label>Payment Method</label>
            <input
                type="text"
                name="payment_method"
                value="{{ contribution[4] }}"
                required
            >

            <label>Reference Number</label>
            <input
                type="text"
                name="reference_number"
                value="{{ contribution[5] }}"
            >

            <button type="submit">Save Changes</button>

        </form>

        <a href="/contributions" class="back">← Back to Contributions</a>

    </div>

</div>

</body>
</html>
