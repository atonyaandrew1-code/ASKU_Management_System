
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temporary Password - ASKU</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 520px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1f4e78;
        }

        .password {
            background: #f4f6f8;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
            margin: 15px 0;
        }

        button, .link {
            display: inline-block;
            border: none;
            border-radius: 5px;
            padding: 11px 16px;
            color: white;
            background: #1f4e78;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 5px 5px 0;
        }

        .warning {
            color: #9a6700;
            background: #fff8c5;
            padding: 12px;
            border-radius: 5px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Password Reset Successful</h1>

        <p>
            A temporary password has been generated for
            <strong>{{ username }}</strong>.
        </p>

        <p>Temporary password:</p>

        <div class="password" id="temporaryPassword">{{ temporary_password }}</div>

        <button type="button" onclick="copyPassword()">
            Copy Password
        </button>

        <a href="{{ url_for('users') }}" class="link">
            Back to Manage Users
        </a>

        <p class="warning">
            Give this password to the user privately. It is not emailed
            automatically. The user should change it after signing in.
        </p>
    </div>

    <script>
        function copyPassword() {
            const password = document.getElementById("temporaryPassword").textContent;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(password)
                    .then(() => alert("Temporary password copied."))
                    .catch(() => alert("Please select and copy the password manually."));
            } else {
                alert("Please select and copy the password manually.");
            }
        }
    </script>
</body>
</html>
