<!DOCTYPE html>
<html>
<head>
    <title>Events - ASKU Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background-color: #1f4e78;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .actions {
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #1f4e78;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1f4e78;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<header>
    <h1>ASKU Management System</h1>
    <h2>Events</h2>
</header>

<div class="container">

    <div class="actions">
        <a href="/add_event" class="button">Add Event</a>
        <a href="/" class="button">Back to Dashboard</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Event ID</th>
                <th>Event Name</th>
                <th>Event Date</th>
                <th>Venue</th>
                <th>Description</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            {% for event in events %}
            <tr>
                <td>{{ event[0] }}</td>
                <td>{{ event[1] }}</td>
                <td>{{ event[2] }}</td>
                <td>{{ event[3] }}</td>
                <td>{{ event[4] }}</td>
                <td>{{ event[5] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6">No events found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
