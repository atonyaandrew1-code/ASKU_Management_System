<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event - ASKU Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f4e78;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #1f4e78;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5a;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #1f4e78;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>ASKU Management System</h1>
        <p>Edit Event</p>
    </div>

    <div class="container">

        <div class="form-box">

            <h2>Edit Event</h2>

            <form method="POST">

                <label>Event ID</label>
                <input
                    type="text"
                    value="{{ event[0] }}"
                    disabled
                >

                <label>Event Name</label>
                <input
                    type="text"
                    name="event_name"
                    value="{{ event[1] }}"
                    required
                >

                <label>Event Date</label>
                <input
                    type="date"
                    name="event_date"
                    value="{{ event[2] }}"
                    required
                >

                <label>Venue</label>
                <input
                    type="text"
                    name="venue"
                    value="{{ event[3] }}"
                    required
                >

                <label>Description</label>
                <textarea name="description">{{ event[4] }}</textarea>

                <label>Status</label>
                <select name="status" required>

                    <option value="Upcoming"
                        {% if event[5] == "Upcoming" %}selected{% endif %}>
                        Upcoming
                    </option>

                    <option value="Ongoing"
                        {% if event[5] == "Ongoing" %}selected{% endif %}>
                        Ongoing
                    </option>

                    <option value="Completed"
                        {% if event[5] == "Completed" %}selected{% endif %}>
                        Completed
                    </option>

                    <option value="Cancelled"
                        {% if event[5] == "Cancelled" %}selected{% endif %}>
                        Cancelled
                    </option>

                </select>

                <button type="submit">Save Changes</button>

            </form>

            <a href="/events" class="back">← Back to Events</a>

        </div>

    </div>

</body>
</html>
